[project]
name = "vyasa"
version = "0.1.0"
description = "Clean OHLCV datasets, parquet only."
requires-python = ">=3.10"
dependencies = ["pandas>=2", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest"]
publish = ["huggingface_hub"]

[project.scripts]
vyasa = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "ingest", "rolls", "validate", "write"]
